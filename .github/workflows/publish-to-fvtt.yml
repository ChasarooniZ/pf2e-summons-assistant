name: Publish new version to foundry
on:
  release:
    types: [released]
jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Publish to Foundry VTT
        uses: mcavallo/foundry-vtt-release@v1
        with:
          foundry-release-token: ${{ secrets.FVTT_API_TOKEN }}
          manifest-path: module.json
          release-notes-url: "https://github.com/${{github.repository}}/releases/tag/${{github.event.release.tag_name}}"
